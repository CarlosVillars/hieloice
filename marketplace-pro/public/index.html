<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HieloIce - Marketplace</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" id="brand-link">
        <span class="brand-logo">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="30" height="30">
            <rect width="64" height="64" rx="16" fill="#0f3d2e"/>
            <g stroke="#d4a017" stroke-width="5" stroke-linecap="round">
              <line x1="32" y1="12" x2="32" y2="52"/>
              <line x1="12" y1="32" x2="52" y2="32"/>
              <line x1="18" y1="18" x2="46" y2="46"/>
              <line x1="46" y1="18" x2="18" y2="46"/>
            </g>
            <circle cx="32" cy="32" r="7" fill="#d4a017"/>
          </svg>
        </span>
        <span id="brand-name">HieloIce</span>
      </a>

      <div class="topbar-search">
        <input type="text" id="global-search" placeholder="Search products..." />
        <button id="global-search-btn">🔍</button>
      </div>

      <nav class="topbar-nav">
        <a href="#/messages" id="nav-messages" class="nav-link">Messages</a>
        <a href="#/profile" id="nav-profile" class="nav-link">Profile</a>
        <a href="#/post" id="nav-post" class="nav-link nav-post-btn">Post an Ad</a>
        <a href="#/login" id="nav-login" class="nav-link">Log In</a>
        <a href="#/register" id="nav-register" class="nav-link">Sign Up</a>
        <button id="nav-logout" class="nav-link nav-link-btn" style="display:none;">Log Out</button>
        <div class="lang-toggle">
          <button id="lang-en" class="lang-btn active">EN</button>
          <button id="lang-es" class="lang-btn">ES</button>
        </div>
      </nav>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <a href="#/terms" id="footer-terms">Terms &amp; Conditions</a>
      <span class="footer-dot">&middot;</span>
      <a href="#/privacy" id="footer-privacy">Privacy Policy</a>
      <p id="footer-rights" class="footer-rights">&copy; 2026 HieloIce. All rights reserved.</p>
    </div>
  </footer>

  <script src="i18n.js"></script>
  <script src="legal.js"></script>
  <script src="app.js"></script>
</body>
</html>
